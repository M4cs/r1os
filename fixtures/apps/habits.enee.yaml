# Generated by Opus 5.5 (low effort) in the S6 eval from the "habits" brief; installed as a dev app.
# Edited by hand: icon names mapped to Phosphor; values with commas quoted.
enee: 1
app: { id: habits, name: Habits, icon: check, archetype: habit, accent: green, description: Tick off habits once per day and track streaks. }
data:
  habits:
    name: text!
  ticks:
    habit_id: ref(habits)!
    day: date = today
  _indexes: [ "unique ticks(habit_id, day)" ]
queries:
  habit_list: >-
    SELECT h.id, h.name,
    coalesce((SELECT streak(t.day) FROM ticks t WHERE t.habit_id = h.id), 0) AS streak,
    EXISTS (SELECT 1 FROM ticks t WHERE t.habit_id = h.id AND t.day = today()) AS done,
    CASE WHEN EXISTS (SELECT 1 FROM ticks t WHERE t.habit_id = h.id AND t.day = today()) THEN 'check' ELSE 'circle' END AS icon,
    CASE WHEN EXISTS (SELECT 1 FROM ticks t WHERE t.habit_id = h.id AND t.day = today()) THEN 'Undo' ELSE 'Tick' END AS tick_label
    FROM habits h ORDER BY h.created_at
  summary: SELECT (SELECT count(*) FROM habits) AS total, (SELECT count(*) FROM ticks WHERE day = today()) AS done
  per_day: SELECT day, count(*) AS done FROM ticks WHERE day >= date(today(), '-120 days') GROUP BY day
state:
  draft: { name: "" }
actions:
  add_habit:
    params: { name: text }
    do:
      - sql: INSERT INTO habits (name) VALUES (:name)
      - set: { state.draft.name: "" }
      - toast: "Added {{params.name}}"
  toggle:
    params: { id: int }
    do:
      - sql: DELETE FROM ticks WHERE habit_id = :id AND day = today() AND EXISTS (SELECT 1 FROM ticks WHERE habit_id = :id AND day = today())
  tick:
    params: { id: int }
    do:
      - sql: INSERT OR IGNORE INTO ticks (habit_id) VALUES (:id)
  untick:
    params: { id: int }
    do:
      - sql: DELETE FROM ticks WHERE habit_id = :id AND day = today()
  remove:
    params: { id: int }
    confirm: Delete this habit and its history?
    do:
      - sql: DELETE FROM ticks WHERE habit_id = :id
      - sql: DELETE FROM habits WHERE id = :id
views:
  main:
    - stat: { label: Today, value: "{{summary.done}}/{{summary.total}}", caption: habits done }
    - progress: { value: "{{summary.done}}", max: "{{summary.total}}" }
    - list:
        data: habit_list
        title: "{{row.name}}"
        caption: "{{row.streak | plural:day}} streak"
        row_actions:
          - { icon: check, label: Tick, action: tick, params: { id: "{{row.id}}" } }
          - { icon: arrow-u-up-left, label: Undo, action: untick, params: { id: "{{row.id}}" } }
          - { icon: trash, label: Delete, action: remove, params: { id: "{{row.id}}" } }
        empty: No habits yet
    - form:
        fields: [ { bind: state.draft.name, label: New habit, placeholder: e.g. Read 10 pages } ]
        submit: { label: Add habit, action: add_habit }
    - calendar_heatmap: { data: per_day, date: day, value: done, weeks: 16, title: Habits kept }
checks:
  - do:
      - { action: add_habit, params: { name: Read } }
      - { action: tick, params: { id: 1 } }
      - { action: tick, params: { id: 1 } }
    expect: { habit_list.0.streak: 1, summary.done: 1, summary.total: 1 }
  - do:
      - { action: add_habit, params: { name: Read } }
      - { action: tick, params: { id: 1 } }
      - { action: untick, params: { id: 1 } }
    expect: { habit_list.0.streak: 0, summary.done: 0 }
