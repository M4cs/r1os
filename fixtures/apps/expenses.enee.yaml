# Generated by Opus 5.5 (low effort) in the S6 eval from the "expenses" brief; installed as a dev app. Its Category
# field compiles to a select (options inferred from the enum param of `add`).
enee: 1
app: { id: expenses, name: Expenses, icon: wallet, archetype: tracker, accent: green, description: Log expenses by category and see this month's spending. }
data:
  expenses:
    amount: real!
    category: enum(food|transport|fun|bills)!
    note: text?
    at: datetime = now
  _indexes: [ expenses(at) ]
queries:
  month: SELECT coalesce(sum(amount), 0) AS total, count(*) AS n FROM expenses WHERE is_this_month(at)
  per_category: SELECT category, coalesce(sum(amount), 0) AS spent FROM expenses WHERE is_this_month(at) GROUP BY category ORDER BY category
  recent: SELECT id, amount, category, coalesce(note, '') AS note, at FROM expenses ORDER BY at DESC LIMIT 30
state:
  draft: { amount: 0, category: food, note: "" }
actions:
  add:
    params: { amount: real, category: enum(food|transport|fun|bills), note: text? }
    do:
      - sql: INSERT INTO expenses (amount, category, note) VALUES (:amount, :category, nullif(:note, ''))
      - set: { state.draft.amount: 0, state.draft.note: "" }
      - toast: "{{params.amount | number:2}} added to {{params.category}}"
  remove:
    params: { id: int }
    confirm: Delete this expense?
    do:
      - sql: DELETE FROM expenses WHERE id = :id
views:
  main:
    - stat: { label: This month, value: "{{month.total}}", format: "number:2", caption: "{{month.n | plural:expense}}" }
    - form:
        title: Add expense
        fields:
          - { bind: state.draft.amount, label: Amount, type: number }
          - { bind: state.draft.category, label: Category, type: select, options: [food, transport, fun, bills] }
          - { bind: state.draft.note, label: Note, placeholder: Optional }
        submit: { label: Add, action: add }
    - chart: { kind: donut, data: per_category, x: category, y: spent, title: Spending by category this month }
    - list:
        data: recent
        title: "{{row.amount | number:2}} · {{row.category}}"
        caption: "{{row.note}} {{row.at | relative}}"
        row_actions: [ { icon: trash, label: Delete, action: remove, params: { id: "{{row.id}}" } } ]
        empty: No expenses yet
checks:
  - do:
      - { action: add, params: { amount: 12.5, category: food } }
      - { action: add, params: { amount: 7.5, category: food, note: lunch } }
      - { action: add, params: { amount: 30, category: bills } }
    expect: { month.total: 50, month.n: 3, per_category.0.category: bills, per_category.0.spent: 30, per_category.1.spent: 20 }
  - do:
      - { action: add, params: { amount: 10, category: fun } }
      - { action: remove, params: { id: 1 } }
    expect: { month.total: 0, month.n: 0 }
