# Generated by Opus 5.5 (low effort) in the S6 eval from the "standup" brief; installed as a dev app.
# Edited by hand: icon names mapped to Phosphor; values with commas quoted.
enee: 1
app:
  id: standup
  name: Standup
  icon: notebook
  archetype: notes
  accent: blue
  description: Write your daily standup and look back at past entries.
permissions:
  notify: Remind you to write your standup
  schedule: Check each morning at your reminder time whether today's standup is written
settings:
  remind_at: { type: time, default: "09:30", label: Remind me at }
data:
  entries:
    day: date = today
    yesterday: text!
    today: text!
    blockers: text?
  _indexes: [ "unique entries(day)" ]
queries:
  current: SELECT count(*) AS n FROM entries WHERE day = today()
  past: SELECT id, day, yesterday, today, coalesce(nullif(blockers, ''), 'No blockers') AS blockers FROM entries ORDER BY day DESC LIMIT 60
  total: SELECT count(*) AS n FROM entries
state:
  _persist: [ draft ]   # a half-written standup survives a restart
  draft: { yesterday: "", today: "", blockers: "" }
actions:
  save:
    params: { yesterday: text, today: text, blockers: text? }
    do:
      - sql: INSERT INTO entries (yesterday, today, blockers) VALUES (:yesterday, :today, :blockers) ON CONFLICT(day) DO UPDATE SET yesterday = excluded.yesterday, today = excluded.today, blockers = excluded.blockers
      - set: { state.draft: { yesterday: "", today: "", blockers: "" } }
      - toast: Standup saved
  remove:
    params: { id: int }
    confirm: Delete this entry?
    do:
      - sql: DELETE FROM entries WHERE id = :id
views:
  main:
    - text: { text: Today's standup is written, tone: accent, visible: { when: current.n, gt: 0 } }
    - form:
        title: Today's standup
        fields:
          - { bind: state.draft.yesterday, label: What I did yesterday }
          - { bind: state.draft.today, label: What I'll do today }
          - { bind: state.draft.blockers, label: Blockers, placeholder: None }
        submit: { label: Save standup, action: save }
    - list:
        data: past
        title: "{{row.day | date}} · {{row.today}}"
        caption: "Yesterday: {{row.yesterday}} · Blockers: {{row.blockers}}"
        row_actions: [ { icon: trash, label: Delete, action: remove, params: { id: "{{row.id}}" } } ]
        empty: No entries yet
triggers:
  reminder:
    at: "{{settings.remind_at}}"
    when: SELECT local_weekday(now()) BETWEEN 1 AND 5 AND (SELECT count(*) FROM entries WHERE day = today()) = 0
    do:
      - notify: { title: Standup time, body: "Write down yesterday, today and blockers" }
checks:
  - do: { action: save, params: { yesterday: Fixed login bug, today: Ship release, blockers: "" } }
    expect: { current.n: 1, past.0.today: Ship release, past.0.blockers: No blockers }
  - do:
      - { action: save, params: { yesterday: A, today: B } }
      - { action: save, params: { yesterday: C, today: D } }
    expect: { total.n: 1, past.0.today: D }
