# Generated by Opus 5.5 (low effort) in the S6 eval from the "coffee" brief; installed as a dev app.
# Edited by hand: icon names mapped to Phosphor; values with commas quoted.
enee: 1
app: { id: coffee-counter, name: Coffee, icon: coffee, archetype: tracker, accent: orange, description: Count today's cups of coffee and see the last 7 days. }
data:
  cups:
    at: datetime = now
  _indexes: [ cups(at) ]
queries:
  today: SELECT count(*) AS n FROM cups WHERE is_today(at)
  per_day: SELECT local_date(at) AS day, count(*) AS cups FROM cups WHERE at >= days_ago(6) GROUP BY day ORDER BY day
actions:
  add:
    do:
      - sql: INSERT INTO cups (at) VALUES (now())
      - toast: +1 cup
  undo:
    do:
      - sql: DELETE FROM cups WHERE id = (SELECT max(id) FROM cups WHERE is_today(at))
      - toast: Removed last cup
views:
  main:
    - stat: { label: Today, value: "{{today.n}}", caption: "{{today.n | plural:cup}}" }
    - row:
        - button: { label: "+1", action: add, variant: primary, icon: plus }
        - button: { label: Undo last cup, action: undo, variant: secondary, icon: arrow-u-up-left }
    - chart: { kind: bar, data: per_day, x: day, y: cups, title: Cups per day (last 7 days) }
checks:
  - do: [ { action: add }, { action: add }, { action: undo } ]
    expect: { today.n: 1 }
  - do: [ { action: add }, { action: add } ]
    expect: { per_day.0.cups: 2 }
