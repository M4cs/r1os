# Generated by Opus 5.5 (low effort) in the S6 eval from the "sleep" brief; installed as a dev app.
# Edited by hand: icon names mapped to Phosphor; values with commas quoted.
enee: 1
app:
  id: sleep-log
  name: Sleep Log
  icon: bed
  archetype: tracker
  accent: purple
  description: Log when you went to bed and woke up, and see how much you sleep.
settings:
  sleep_goal: { type: duration, default: 8h, label: Sleep goal }
data:
  nights:
    day: date = today
    bed: time!
    wake: time!
  _indexes: [ "unique nights(day)" ]
queries:
  week: SELECT coalesce(avg(secs), 0) AS avg_secs, count(*) AS n FROM (SELECT ((strftime('%s', '2000-01-01 ' || wake) - strftime('%s', '2000-01-01 ' || bed)) + 86400) % 86400 AS secs FROM nights ORDER BY day DESC LIMIT 7)
  per_night: SELECT day, round((((strftime('%s', '2000-01-01 ' || wake) - strftime('%s', '2000-01-01 ' || bed)) + 86400) % 86400) / 3600.0, 1) AS hours FROM nights WHERE day >= date(today(), '-30 days') ORDER BY day
  recent: SELECT id, day, bed, wake, ((strftime('%s', '2000-01-01 ' || wake) - strftime('%s', '2000-01-01 ' || bed)) + 86400) % 86400 AS secs FROM nights ORDER BY day DESC LIMIT 30
  count_all: SELECT count(*) AS n FROM nights
state:
  draft: { day: "", bed: "23:00", wake: "07:00" }
actions:
  log:
    params: { day: date?, bed: time, wake: time }
    do:
      - sql: INSERT INTO nights (day, bed, wake) VALUES (coalesce(nullif(:day, ''), today()), :bed, :wake) ON CONFLICT(day) DO UPDATE SET bed = excluded.bed, wake = excluded.wake
      - toast: "Logged {{params.bed}} → {{params.wake}}"
  remove:
    params: { id: int }
    confirm: Delete this night?
    do:
      - sql: DELETE FROM nights WHERE id = :id
views:
  main:
    - stat: { label: Average sleep (last 7 nights), value: "{{week.avg_secs | duration}}", caption: "{{week.n}} nights · goal {{settings.sleep_goal | duration}}" }
    - progress: { value: "{{week.avg_secs}}", max: "{{settings.sleep_goal}}" }
    - form:
        title: Log a night
        fields:
          - { bind: state.draft.day, label: Woke up on, type: date }
          - { bind: state.draft.bed, label: Went to bed, type: time }
          - { bind: state.draft.wake, label: Woke up, type: time }
        submit: { label: Log night, action: log }
    - chart: { kind: line, data: per_night, x: day, y: hours, title: Hours slept per night }
    - list:
        data: recent
        title: "{{row.secs | duration}}"
        caption: "{{row.day | date}} · {{row.bed}} → {{row.wake}}"
        row_actions: [ { icon: trash, label: Delete, action: remove, params: { id: "{{row.id}}" } } ]
        empty: No nights logged yet
checks:
  - do: { action: log, params: { day: "2026-10-01", bed: "23:00", wake: "07:00" } }
    expect: { week.avg_secs: 28800, week.n: 1 }
  - do:
      - { action: log, params: { day: "2026-10-01", bed: "23:00", wake: "07:00" } }
      - { action: log, params: { day: "2026-10-02", bed: "00:00", wake: "06:00" } }
      - { action: log, params: { day: "2026-10-02", bed: "01:00", wake: "07:00" } }
    expect: { week.avg_secs: 25200, count_all.n: 2 }
