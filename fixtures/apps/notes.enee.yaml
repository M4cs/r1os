# Generated by Opus 5.5 (low effort) in the S6 eval from the "notes" brief; installed as a dev app.
# Edited by hand: icon names mapped to Phosphor; values with commas quoted.
enee: 1
app: { id: quick-notes, name: Quick Notes, icon: notebook, archetype: notes, accent: yellow, description: "Jot notes with a title and body, search them and delete old ones." }
data:
  notes:
    title: text!
    body: text?
  _indexes: [ notes(created_at) ]
queries:
  search:
    sql: SELECT id, title, body, created_at FROM notes WHERE title LIKE '%' || :q || '%' OR coalesce(body, '') LIKE '%' || :q || '%' ORDER BY created_at DESC, id DESC
    params: { q: "{{state.query}}" }
  stats: SELECT count(*) AS n FROM notes
state:
  _persist: [ draft ]   # a half-written note survives a restart
  draft: { title: "", body: "" }
  query: ""
actions:
  add:
    params: { title: text, body: text? }
    do:
      - sql: INSERT INTO notes (title, body) VALUES (:title, :body)
      - set: { state.draft.title: "", state.draft.body: "" }
      - toast: Note saved
  remove:
    params: { id: int }
    confirm: Delete this note?
    do:
      - sql: DELETE FROM notes WHERE id = :id
      - toast: Note deleted
views:
  main:
    - form:
        title: New note
        fields:
          - { bind: state.draft.title, label: Title, placeholder: Title }
          - { bind: state.draft.body, label: Body, placeholder: Write something… }
        submit: { label: Save note, action: add }
    - input: { bind: state.query, placeholder: Search notes }
    - text: { text: "{{stats.n | plural:note}}", tone: muted }
    - list:
        data: search
        title: "{{row.title}}"
        caption: "{{row.created_at | relative}} · {{row.body | default:}}"
        row_actions: [ { icon: trash, label: Delete, action: remove, params: { id: "{{row.id}}" } } ]
        empty: No notes found
checks:
  - do:
      - { action: add, params: { title: Groceries, body: milk and eggs } }
      - { action: add, params: { title: Ideas, body: build a notes app } }
    expect: { stats.n: 2, search.0.title: Ideas }
  - do:
      - { action: add, params: { title: Groceries, body: milk } }
      - { action: remove, params: { id: 1 } }
    expect: { stats.n: 0 }
