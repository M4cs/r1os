# Generated by Opus 5.5 (low effort) in the S6 eval from the "bookmarks" brief; installed as a dev app.
# Edited by hand: icon names mapped to Phosphor; values with commas quoted.
enee: 1
app: { id: links, name: Links, icon: link, archetype: list, accent: blue, description: Save links with a title and a URL and open them in your browser. }
permissions:
  open.url: Open a saved link in your browser
data:
  links:
    title: text!
    url: text!
  _indexes: [ links(created_at) ]
queries:
  recent: SELECT id, title, url, created_at FROM links ORDER BY created_at DESC, id DESC
  stats: SELECT count(*) AS n FROM links
state:
  draft: { title: "", url: "" }
actions:
  add:
    params: { title: text, url: text }
    do:
      - sql: INSERT INTO links (title, url) VALUES (:title, :url)
      - set: { state.draft.title: "", state.draft.url: "" }
      - toast: Link saved
  open:
    params: { url: text }
    do:
      - open_url: "{{params.url}}"
  copy_link:
    params: { url: text }
    do:
      - copy: "{{params.url}}"
      - toast: Copied
  remove:
    params: { id: int }
    confirm: Delete this link?
    do:
      - sql: DELETE FROM links WHERE id = :id
views:
  main:
    - form:
        fields:
          - { bind: state.draft.title, label: Title, placeholder: My favorite site }
          - { bind: state.draft.url, label: URL, placeholder: "https://…" }
        submit: { label: Save link, action: add }
    - list:
        data: recent
        title: "{{row.title}}"
        caption: "{{row.url}}"
        row_actions:
          - { icon: arrow-square-out, label: Open, action: open, params: { url: "{{row.url}}" } }
          - { icon: copy, label: Copy, action: copy_link, params: { url: "{{row.url}}" } }
          - { icon: trash, label: Delete, action: remove, params: { id: "{{row.id}}" } }
        empty: No links saved yet
checks:
  - do:
      - { action: add, params: { title: First, url: "https://a.com" } }
      - { action: add, params: { title: Second, url: "https://b.com" } }
    expect: { stats.n: 2, recent.0.title: Second }
  - do:
      - { action: add, params: { title: First, url: "https://a.com" } }
      - { action: remove, params: { id: 1 } }
    expect: { stats.n: 0 }
