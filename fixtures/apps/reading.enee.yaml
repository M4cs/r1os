# Generated by Opus 5.5 (low effort) in the S6 eval from the "reading" brief; installed as a dev app.
# Edited by hand: icon names mapped to Phosphor; values with commas quoted.
enee: 1
app: { id: reading-list, name: Reading List, icon: book, archetype: list, accent: purple, description: "Books you want to read, are reading and have read." }
data:
  books:
    title: text!
    author: text
    status: enum(want_to_read|reading|done) = want_to_read
queries:
  counts: SELECT coalesce(sum(status = 'want_to_read'), 0) AS want, coalesce(sum(status = 'reading'), 0) AS reading, coalesce(sum(status = 'done'), 0) AS done FROM books
  reading_now: SELECT id, title, coalesce(author, '') AS author FROM books WHERE status = 'reading' ORDER BY updated_at DESC
  want: SELECT id, title, coalesce(author, '') AS author FROM books WHERE status = 'want_to_read' ORDER BY created_at DESC
  finished: SELECT id, title, coalesce(author, '') AS author, updated_at FROM books WHERE status = 'done' ORDER BY updated_at DESC
state:
  draft: { title: "", author: "" }
actions:
  add:
    params: { title: text, author: text? }
    do:
      - sql: INSERT INTO books (title, author) VALUES (:title, :author)
      - set: { state.draft.title: "", state.draft.author: "" }
      - toast: "Added {{params.title}}"
  advance:
    params: { id: int }
    do:
      - sql: "UPDATE books SET status = CASE status WHEN 'want_to_read' THEN 'reading' ELSE 'done' END, updated_at = now() WHERE id = :id"
  back:
    params: { id: int }
    do:
      - sql: "UPDATE books SET status = CASE status WHEN 'done' THEN 'reading' ELSE 'want_to_read' END, updated_at = now() WHERE id = :id"
  remove:
    params: { id: int }
    confirm: Remove this book?
    do:
      - sql: DELETE FROM books WHERE id = :id
views:
  reading:
    title: Reading
    icon: book-open
    items:
      - row:
          - stat: { label: Reading, value: "{{counts.reading}}" }
          - stat: { label: Want to read, value: "{{counts.want}}" }
          - stat: { label: Done, value: "{{counts.done}}" }
      - list:
          data: reading_now
          title: "{{row.title}}"
          caption: "{{row.author}}"
          row_actions:
            - { icon: check, label: Done, action: advance, params: { id: "{{row.id}}" } }
            - { icon: arrow-u-up-left, label: Back to want to read, action: back, params: { id: "{{row.id}}" } }
          empty: Not reading anything right now
  want:
    title: Want to read
    icon: list
    items:
      - form:
          title: Add a book
          fields:
            - { bind: state.draft.title, label: Title, placeholder: Title }
            - { bind: state.draft.author, label: Author, placeholder: Author }
          submit: { label: Add book, action: add }
      - list:
          data: want
          title: "{{row.title}}"
          caption: "{{row.author}}"
          row_actions:
            - { icon: play, label: Start reading, action: advance, params: { id: "{{row.id}}" } }
            - { icon: trash, label: Remove, action: remove, params: { id: "{{row.id}}" } }
          empty: Nothing on your list yet
  done:
    title: Done
    icon: check
    items:
      - list:
          data: finished
          title: "{{row.title}}"
          caption: "{{row.author}} · {{row.updated_at | date}}"
          row_actions:
            - { icon: arrow-u-up-left, label: Back to reading, action: back, params: { id: "{{row.id}}" } }
            - { icon: trash, label: Remove, action: remove, params: { id: "{{row.id}}" } }
          empty: No finished books yet
checks:
  - do: { action: add, params: { title: Dune, author: Frank Herbert } }
    expect: { counts.want: 1, want.0.title: Dune }
  - do:
      - { action: add, params: { title: Dune, author: Frank Herbert } }
      - { action: advance, params: { id: 1 } }
    expect: { counts.reading: 1, reading_now.0.title: Dune }
  - do:
      - { action: add, params: { title: Dune } }
      - { action: advance, params: { id: 1 } }
      - { action: advance, params: { id: 1 } }
    expect: { counts.done: 1, counts.reading: 0 }
