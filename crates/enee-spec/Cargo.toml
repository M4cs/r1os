[package]
name = "enee-spec"
description = "EneeSpec compiler: YAML app spec -> compiled app (json-render views, SQL, actions) with model-readable diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["sqlite"]
# SQL checking against a scratch SQLite database (native only; not available in the WASM preview build).
sqlite = ["dep:rusqlite"]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde-saphyr = "1.3"
rusqlite = { version = "0.40", features = ["bundled", "hooks", "functions"], optional = true }

[dev-dependencies]
pretty_assertions = "1"
