[package]
name = "enee-data"
description = "Per-app SQLite for enee apps: hardened connections, the contract's SQL helpers, additive migrations and snapshots (ADR-0005)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
enee-spec = { path = "../enee-spec" }
# hooks: authorizer, update hook and progress handler; limits: SQLITE_LIMIT_*; backup: snapshots before migrations.
rusqlite = { version = "0.40", features = ["bundled", "hooks", "functions", "limits", "backup"] }
